<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S7 Robotics — Duolingo Style</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>S7 <span>ROBOTICS</span></h2>
        </div>
        
        <div class="duo-stats" id="studentStats">
            <div class="stat-item">🔥 <span id="streakCount">3</span></div>
            <div class="stat-item">⚡ <span id="xpCount">0</span> XP</div>
            <div class="stat-item">❤️ <span id="gemsCount">5</span></div>
        </div>

        <div class="role-selector">
            <select id="roleSelect" onchange="switchRole()">
                <option value="student">👨‍🎓 Студент (Асан)</option>
                <option value="mentor">👨‍🏫 Ментор (Арман)</option>
            </select>
        </div>
    </header>

    <div class="container">
        <!-- STUDENT VIEW -->
        <main id="studentView" class="view-section active">
            <div class="duo-layout">
                <div class="lesson-map">
                    <h2 class="section-title">🤖 Arduino IDE Курсы</h2>
                    <div id="lessonsContainer" class="lessons-tree"></div>
                </div>

                <div class="sidebar">
                    <div class="duo-card">
                        <h3>🏆 Алтын лига</h3>
                        <p>Орныңыз: <strong>#3 орын</strong></p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 60%;"></div>
                        </div>
                        <small>Келесі деңгейге: 80 XP</small>
                    </div>
                </div>
            </div>
        </main>

        <!-- MENTOR VIEW -->
        <main id="mentorView" class="view-section">
            <div class="duo-card">
                <h3>👨‍🏫 Ментор Панелі — Жобаларды тексеру</h3>
                <table class="duo-table">
                    <thead>
                        <tr>
                            <th>Оқушы</th>
                            <th>Тапсырма</th>
                            <th>Медиа</th>
                            <th>Код</th>
                            <th>Мәртебесі</th>
                            <th>Әрекет</th>
                        </tr>
                    </thead>
                    <tbody id="mentorTableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- AI CHAT WIDGET -->
    <div class="ai-chat-widget">
        <button class="ai-toggle-btn" onclick="toggleAIChat()">🤖 ИИ Подсказка</button>
        <div class="ai-chat-window" id="aiChatWindow">
            <div class="ai-chat-header">
                <span>🤖 AI Robotics Mentor</span>
                <span class="close-chat" onclick="toggleAIChat()">&times;</span>
            </div>
            <div class="ai-chat-body" id="aiChatBody">
                <div class="chat-msg ai-msg">Сәлем! Код бойынша сұрағың болса, менен сұра! 😊</div>
            </div>
            <div class="ai-chat-footer">
                <input type="text" id="aiInput" placeholder="Сұрағыңды жаз..." onkeypress="handleAIPress(event)">
                <button onclick="sendAIMessage()">Жіберу</button>
            </div>
        </div>
    </div>

    <!-- LESSON MODAL -->
    <div id="lessonModal" class="modal">
        <div class="modal-content duo-card">
            <span class="close-btn" onclick="closeLessonModal()">&times;</span>
            <h2 id="modalTitle">Сабақ</h2>
            <p id="modalDesc" class="subtitle"></p>
            <div class="code-box"><pre><code id="modalCode"></code></pre></div>
            <form id="submissionForm" onsubmit="submitProject(event)">
                <div class="form-group">
                    <label>📝 Жоба коды / Түсініктеме:</label>
                    <textarea id="projectCode" required></textarea>
                </div>
                <div class="form-group">
                    <label>🔗 Жоба сілтемесі (Tinkercad / Drive):</label>
                    <input type="url" id="projectMedia" required>
                </div>
                <button type="submit" class="duo-btn duo-btn-green w-100">Жіберу (+50 XP) 🚀</button>
            </form>
        </div>
    </div>

    <!-- MENTOR CODE VIEW MODAL -->
    <div id="mentorCodeModal" class="modal">
        <div class="modal-content duo-card">
            <span class="close-btn" onclick="closeMentorCodeModal()">&times;</span>
            <h2>💻 Оқушының коды</h2>
            <div class="code-box"><pre><code id="mentorCodeContent"></code></pre></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
