<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S7 Robotics — LMS Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- АВТОРИЗАЦИЯ ЖӘНЕ ТІРКЕЛУ ЭКРАНЫ -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card duo-card">
            <h2>S7 <span>ROBOTICS</span></h2>
            
            <!-- Табтар: Кіру / Тіркелу -->
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button type="button" id="loginTabBtn" class="duo-btn duo-btn-primary" style="flex: 1;" onclick="switchAuthMode('login')">Кіру</button>
                <button type="button" id="regTabBtn" class="duo-btn duo-btn-gray" style="flex: 1;" onclick="switchAuthMode('register')">Тіркелу</button>
            </div>

            <!-- 1. КІРУ ФОРМАСЫ (LOGIN) -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email немесе Телефон:</label>
                    <input type="text" id="loginIdentifier" placeholder="example@mail.com немесе +77071234567" required>
                </div>

                <div class="form-group">
                    <label>Құпия сөз (Пароль):</label>
                    <input type="password" id="loginPassword" placeholder="Құпия сөзіңізді енгізіңіз" required>
                </div>

                <button type="submit" class="duo-btn duo-btn-green w-100">Платформаға кіру 🚀</button>
            </form>

            <!-- 2. ТІРКЕЛУ ФОРМАСЫ (REGISTER) -->
            <form id="regForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Рөлді таңдаңыз:</label>
                    <select id="regRole" onchange="toggleMentorPasswordInput()" required>
                        <option value="student">👨‍🎓 Студент</option>
                        <option value="mentor">👨‍🏫 Ментор</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Аты-жөніңіз:</label>
                    <input type="text" id="regName" placeholder="Арман Қасымов" required>
                </div>

                <div class="form-group">
                    <label>Email почтаңыз:</label>
                    <input type="email" id="regEmail" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label>Телефон нөміріңіз:</label>
                    <input type="tel" id="regPhone" placeholder="+7 707 123 4567" required>
                </div>

                <div class="form-group">
                    <label>Құпия сөз ойлап табыңыз:</label>
                    <input type="password" id="regPassword" placeholder="Кемінде 4 таңба" required>
                </div>

                <div class="form-group" id="mentorPasswordGroup" style="display: none;">
                    <label>🔒 Ментордың арнайы коды:</label>
                    <input type="password" id="mentorSecret" placeholder="Арнайы кодты енгізіңіз">
                </div>

                <button type="submit" class="duo-btn duo-btn-green w-100">Аккаунт ашу ✨</button>
            </form>
        </div>
    </div>

    <!-- СТУДЕНТ КАБИНЕТІ -->
    <div id="studentApp" style="display: none;">
        <header class="navbar">
            <div class="logo">
                <h2>S7 <span>ROBOTICS</span></h2>
            </div>
            <div class="duo-stats">
                <div class="stat-item">🔥 <span id="streakCount">1</span> күн</div>
                <div class="stat-item">⚡ <span id="xpCount">0</span> XP</div>
                <div class="stat-item">👤 <span id="studentNameDisplay">Оқушы</span></div>
                <button class="logout-btn" onclick="logout()">Шығу 🚪</button>
            </div>
        </header>

        <div class="container">
            <div class="duo-layout">
                <div class="lesson-map">
                    <h2 class="section-title">🤖 Arduino IDE Оқу Картасы</h2>
                    <div id="lessonsContainer" class="lessons-tree"></div>
                </div>

                <div class="sidebar">
                    <div class="duo-card">
                        <h3>🏆 Лига Рейтингі</h3>
                        <p>Мәртебеңіз: <strong>Белсенді оқушы</strong></p>
                        <div class="progress-bar-container">
                            <div class="progress-bar" style="width: 40%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МЕНТОР КАБИНЕТІ -->
    <div id="mentorApp" style="display: none;">
        <header class="navbar navbar-mentor">
            <div class="logo">
                <h2>S7 <span>MENTOR PANEL</span></h2>
            </div>
            <div class="duo-stats">
                <div class="stat-item">👨‍🏫 <span id="mentorNameDisplay">Ментор</span></div>
                <button class="logout-btn" onclick="logout()">Шығу 🚪</button>
            </div>
        </header>

        <div class="container">
            <div class="duo-card">
                <h3>📋 Тексеруге түскен студенттердің тапсырмалары</h3>
                <table class="duo-table">
                    <thead>
                        <tr>
                            <th>Студент</th>
                            <th>Байланыс</th>
                            <th>Тапсырма</th>
                            <th>Сілтеме</th>
                            <th>Код</th>
                            <th>Мәртебесі</th>
                            <th>Әрекет</th>
                        </tr>
                    </thead>
                    <tbody id="mentorTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- САБАҚ ЖӘНЕ КОДТЫ ТЕКСЕРУ MODAL -->
    <div id="lessonModal" class="modal">
        <div class="modal-content duo-card" style="max-width: 650px;">
            <span class="close-btn" onclick="closeLessonModal()">&times;</span>
            <h2 id="modalTitle">Сабақ</h2>
            <p id="modalDesc" class="subtitle" style="text-align: left;"></p>
            
            <label><strong>📌 Үлгі код:</strong></label>
            <div class="code-box"><pre><code id="modalCode"></code></pre></div>

            <form id="submissionForm" onsubmit="submitProject(event)">
                <div class="form-group">
                    <label>💻 Өз кодыңызды жазыңыз және тексеріңіз:</label>
                    <textarea id="projectCode" rows="6" style="font-family: monospace; background: #0f172a; color: #38bdf8; padding: 10px;" required placeholder="C++ / Arduino кодын осы жерге жазыңыз..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button type="button" class="duo-btn duo-btn-primary" onclick="testCodeRun()" style="flex: 1;">⚡ Кодты синтаксиске тексеру</button>
                </div>
                <div id="compilerConsole" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; font-family: monospace; margin-bottom: 15px;"></div>

                <div class="form-group">
                    <label>🔗 Жоба симуляциясының сілтемесі (Wokwi / Tinkercad):</label>
                    <input type="url" id="projectMedia" required placeholder="https://wokwi.com/projects/...">
                </div>

                <button type="submit" id="submitBtn" class="duo-btn duo-btn-green w-100">Менторға жіберу (+50 XP) 🚀</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
