<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S7 Robotics — LMS Platform</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase Бұлтты База Скрипттері -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- АВТОРИЗАЦИЯ ЖӘНЕ ТІРКЕЛУ -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <h2>S7 <span>ROBOTICS</span></h2>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px; margin-top: 15px;">
                <button type="button" id="loginTabBtn" class="duo-btn duo-btn-primary" style="flex: 1;" onclick="switchAuthMode('login')">Кіру</button>
                <button type="button" id="regTabBtn" class="duo-btn duo-btn-gray" style="flex: 1;" onclick="switchAuthMode('register')">Тіркелу</button>
            </div>

            <!-- 1. КІРУ ФОРМАСЫ -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email немесе Телефон:</label>
                    <input type="text" id="loginIdentifier" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Құпия сөз (Пароль):</label>
                    <input type="password" id="loginPassword" placeholder="Пароліңізді енгізіңіз" required>
                </div>
                <button type="submit" class="duo-btn duo-btn-green w-100">Кіру 🚀</button>
            </form>

            <!-- 2. ТІРКЕЛУ ФОРМАСЫ -->
            <form id="regForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label>Рөлді таңдаңыз:</label>
                    <select id="regRole" required>
                        <option value="student">👨‍🎓 Студент</option>
                        <option value="mentor">👨‍🏫 Ментор</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Аты-жөніңіз:</label>
                    <input type="text" id="regName" placeholder="Арман Қасымов" required>
                </div>
                <div class="form-group">
                    <label>Email почтаңыз:</label>
                    <input type="email" id="regEmail" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label>Телефон нөміріңіз:</label>
                    <input type="tel" id="regPhone" placeholder="+7 707 123 4567" required>
                </div>
                <div class="form-group">
                    <label>Өзіңізге пароль ойлап табыңыз:</label>
                    <input type="password" id="regPassword" placeholder="Кемінде 4 таңба" required>
                </div>
                <button type="submit" class="duo-btn duo-btn-green w-100">Тіркелу ✨</button>
            </form>
        </div>
    </div>

    <!-- СТУДЕНТ КАБИНЕТІ -->
    <div id="studentApp" style="display: none;">
        <header class="navbar">
            <div class="logo">
                <h2>S7 <span>ROBOTICS</span></h2>
            </div>
            <div class="duo-stats">
                <div class="stat-item">🔥 <span id="streakCount">1</span> күн</div>
                <div class="stat-item">⚡ <span id="xpCount">0</span> XP</div>
                <div class="stat-item">👤 <span id="studentNameDisplay">Оқушы</span></div>
                <button class="duo-btn duo-btn-gray" style="padding: 5px 10px;" onclick="logout()">Шығу 🚪</button>
            </div>
        </header>

        <div class="container">
            <div class="duo-layout">
                <div class="lesson-map duo-card" style="width: 100%;">
                    <h2>🤖 Arduino IDE & IoT Оқу Картасы</h2>
                    <div id="lessonsContainer" class="lessons-tree"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- МЕНТОР КАБИНЕТІ -->
    <div id="mentorApp" style="display: none;">
        <header class="navbar navbar-mentor">
            <div class="logo">
                <h2>S7 <span>MENTOR PANEL</span></h2>
            </div>
            <div class="duo-stats">
                <div class="stat-item">👨‍🏫 <span id="mentorNameDisplay">Ментор</span></div>
                <button class="duo-btn duo-btn-gray" style="padding: 5px 10px;" onclick="logout()">Шығу 🚪</button>
            </div>
        </header>

        <div class="container">
            <div class="duo-card">
                <h3>📋 Тексеруге түскен барлық тапсырмалар</h3>
                <table class="duo-table">
                    <thead>
                        <tr>
                            <th>Студент</th>
                            <th>Тапсырма</th>
                            <th>Сілтеме</th>
                            <th>Код</th>
                            <th>Әрекет</th>
                        </tr>
                    </thead>
                    <tbody id="mentorTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- СТУДЕНТ САБАҚ MODAL -->
    <div id="lessonModal" class="modal" style="display: none;">
        <div class="modal-content duo-card">
            <span class="close-btn" onclick="closeLessonModal()">&times;</span>
            <h2 id="modalTitle">Сабақ</h2>
            <p id="modalDesc" style="margin: 10px 0; color: #94a3b8;"></p>
            
            <label><strong>📌 Үлгі код:</strong></label>
            <div class="code-box"><pre><code id="modalCode"></code></pre></div>

            <form id="submissionForm" onsubmit="submitProject(event)">
                <div class="form-group">
                    <label>💻 Өз кодыңызды жазыңыз:</label>
                    <textarea id="projectCode" rows="5" required placeholder="C++ / Arduino кодын осы жерге жазыңыз..."></textarea>
                </div>

                <button type="button" class="duo-btn duo-btn-primary w-100" onclick="testCodeRun()" style="margin-bottom: 10px;">⚡ Кодты синтаксиске тексеру</button>
                <div id="compilerConsole" style="display: none; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 10px;"></div>

                <div class="form-group">
                    <label>🔗 Жоба симуляциясының сілтемесі (Wokwi / Tinkercad):</label>
                    <input type="url" id="projectMedia" required placeholder="https://wokwi.com/projects/...">
                </div>

                <button type="submit" class="duo-btn duo-btn-green w-100">Менторларға жіберу (+50 XP) 🚀</button>
            </form>

            <div id="alreadySubmittedMsg" style="display: none; padding: 15px; background: #0f172a; border-radius: 10px; border: 1px solid #22c55e; margin-top: 15px; text-align: center;">
                <p style="color: #22c55e; font-weight: 700;">✅ Бұл тапсырма бойынша жауап жіберілген!</p>
                <p style="color: #94a3b8; font-size: 13px; margin-top: 5px;">Қайтадан жауап жіберуге болмайды.</p>
            </div>
        </div>
    </div>

    <!-- МЕНТОР КОД ҚАРАУ MODAL -->
    <div id="viewCodeModal" class="modal" style="display: none;">
        <div class="modal-content duo-card">
            <span class="close-btn" onclick="closeViewCodeModal()">&times;</span>
            <h3 id="codeModalStudentName">Студент коды</h3>
            <p id="codeModalLessonTitle" style="color: #94a3b8; margin-bottom: 10px;"></p>
            <div class="code-box" style="max-height: 350px; overflow-y: auto;">
                <pre><code id="codeModalContent" style="color: #38bdf8;"></code></pre>
            </div>
            <button class="duo-btn duo-btn-primary w-100" style="margin-top: 15px;" onclick="closeViewCodeModal()">Жабу</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
